# Home Assistant -> Supabase presence bridge  (as deployed)
#
# The LIVE copy of this lives on the mediaserver at
# /opt/homeassistant/config/  (configuration.yaml + automations.yaml +
# secrets.yaml) and is NOT in this repo or the restic backup. This file mirrors
# it so the wiring is recorded; keep them in sync by hand.
#
# Pipeline: sensor.matt_s_apple_watch_area (Bermuda) -> this automation ->
# rest_command -> Edge Function `set-presence` -> set_presence() -> presence row
# -> app Realtime. See docs/presence-plan.md and supabase/functions/set-presence/.

# ── configuration.yaml ──────────────────────────────────────────────────────

rest_command:
  set_presence:
    url: "https://tyseetokvhfgbyavszvc.supabase.co/functions/v1/set-presence"
    method: POST
    headers:
      x-ha-secret: !secret ha_presence_secret       # == Edge Fn HA_PRESENCE_SECRET
      content-type: application/json
    payload: '{"room_id": "{{ room_id }}", "source": "ble"}'

# ── secrets.yaml ────────────────────────────────────────────────────────────
#   ha_presence_secret: "<long random hex, same value as `supabase secrets set
#                         HA_PRESENCE_SECRET=`>"

# ── automations.yaml ───────────────────────────────────────────────────────

- alias: "Presence: push Watch room changes to Anon"
  id: presence_push_watch_room
  mode: restart
  variables:
    # HA Area name (exact sensor state) -> app rooms.id UUID.
    # Bermuda's *_area sensor reports the area NAME, not the slug.
    # "Main Bedroom" is dead until a proxy is placed there.
    area_map:
      "Living Room": "8e8d059d-8b66-4f65-b998-8275cee29bf7"
      "Basement": "65e774cc-bdf9-4cc4-a2df-01108155f6a2"
      "Main Bedroom": "41b36272-49d4-4af2-99a6-0406b7824f16"
  trigger:
    - platform: state
      entity_id: sensor.matt_s_apple_watch_area
      for: "00:00:08"          # bump to ~20s until Bermuda max_radius is calibrated
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state in area_map }}"
  action:
    - service: rest_command.set_presence
      data:
        room_id: "{{ area_map[trigger.to_state.state] }}"

# Reload: Developer Tools -> YAML -> Reload All YAML (rest_command doesn't
# reload with "Reload Automations"), or restart HA.

