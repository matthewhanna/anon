# Home Assistant -> Supabase presence bridge
#
# Copy the relevant blocks into your HA config (/opt/homeassistant/config/).
# `rest_command:` and `automation:` can live in configuration.yaml, or in
# rest_commands.yaml / automations.yaml if you split your config.
#
# Fill in:
#   - the Edge Function URL (Supabase -> Edge Functions -> set-presence -> URL,
#     or http://<host>:54321/functions/v1/set-presence for a local stack)
#   - !secret ha_presence_secret  in secrets.yaml  (must equal the Edge
#     Function's HA_PRESENCE_SECRET env var)
#   - the area_map: HA Area *name* (exactly as shown by the sensor) -> the app's
#     room UUID (from the `rooms` table / the app's room list)
#   - the tracked sensor entity id (Bermuda: sensor.<device>_area)

# --------------------------------------------------------------------------

rest_command:
  set_presence:
    url: "https://<PROJECT-REF>.supabase.co/functions/v1/set-presence"
    method: POST
    headers:
      x-ha-secret: !secret ha_presence_secret
      content-type: application/json
    # room_id may be the string "null" -> the template below turns it into a
    # real JSON null so the Edge Function marks you "away".
    payload: >-
      {"room_id": {{ 'null' if room_id in [none, 'null', ''] else '"' ~ room_id ~ '"' }},
       "source": "ble"}

# --------------------------------------------------------------------------

automation:
  - alias: "Presence: push room changes to Anon"
    id: presence_push_room_changes
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.matt_watch_area   # <- your Bermuda area sensor
        for: "00:00:08"                      # debounce flapping across a boundary
    condition:
      # ignore transient unknown/unavailable blips
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', 'none'] }}"
    action:
      - variables:
          area_map:
            # HA Area name : app room UUID
            "Living Room": "00000000-0000-0000-0000-000000000000"
            "Basement": "00000000-0000-0000-0000-000000000000"
            "Office": "00000000-0000-0000-0000-000000000000"
          area: "{{ trigger.to_state.state }}"
      - service: rest_command.set_presence
        data:
          # mapped room UUID, or "null" when the area isn't one we map (-> away)
          room_id: "{{ area_map.get(area, 'null') }}"

  # OPTIONAL: local notification when the room changes.
  - alias: "Presence: notify on room change"
    id: presence_notify_room_change
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.matt_watch_area
        for: "00:00:08"
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.from_state.state != trigger.to_state.state }}
    action:
      - service: notify.notify          # or notify.mobile_app_<device>
        data:
          title: "Room change"
          message: "Matt: {{ trigger.from_state.state }} -> {{ trigger.to_state.state }}"

# --------------------------------------------------------------------------
# secrets.yaml
#   ha_presence_secret: "<long random string, same as HA_PRESENCE_SECRET>"
